[project]
name = "sazon-urbano-pia"
version = "1.0.0"
description = "PIA Componentes de Lógica de Negocios: Sazón Urbano (DDD, Specification, State Machine, API REST)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: pruebas unitarias (reglas de negocio sin base de datos ni servicios)",
    "integration: pruebas de integración (base de datos, servicios y API)",
]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # Depends()/Header()/Query() como valores por defecto es el estilo de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # las pruebas HTTP son más legibles en una sola línea
"scripts/**" = ["E501"]
"src/api/aplicacion.py" = ["E501"]  # textos largos de la documentación OpenAPI
